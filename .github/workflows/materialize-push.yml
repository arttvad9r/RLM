name: Materialize certified RLM tree on push

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct certified source archive from PR chunks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/1/comments?per_page=100" > /tmp/comments.json
          python - <<'PY'
          import base64, hashlib, json, re
          from pathlib import Path

          comments = json.loads(Path('/tmp/comments.json').read_text())
          total = 35
          pattern = re.compile(r'^RLM_EXPORT_CHUNK (\d+)/(\d+)\n([\s\S]+)$')
          chunks = {}
          for item in comments:
              match = pattern.match(item.get('body') or '')
              if not match:
                  continue
              number = int(match.group(1))
              declared = int(match.group(2))
              if declared != total or not (1 <= number <= total):
                  continue
              data = ''.join(match.group(3).split())
              expected = 4500 if number < total else 3420
              if len(data) != expected:
                  print(f'ignore invalid chunk {number}: length {len(data)} expected {expected}')
                  continue
              chunks[number] = data

          missing = [number for number in range(1, total + 1) if number not in chunks]
          if missing:
              raise SystemExit(f'missing valid chunks: {missing}')

          encoded = ''.join(chunks[number] for number in range(1, total + 1))
          raw = base64.b64decode(encoded, validate=True)
          if len(raw) != 117315:
              raise SystemExit(f'archive size mismatch: {len(raw)}')

          git_blob = hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()
          print(f'archive blob: {git_blob}')
          expected_blob = '948520ebfd6c41f14106a29af1045e78c3f3ae32'
          if git_blob != expected_blob:
              raise SystemExit(f'archive blob mismatch: {git_blob} != {expected_blob}')
          Path('/tmp/rlm-standalone-f72.tar.gz').write_bytes(raw)
          PY

      - name: Replace bootstrap tree and verify Git identity
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/rlm-standalone-f72.tar.gz -C .
          test ! -e .migration
          test ! -e .github/workflows/export-rlm-migration.yml
          git add -A
          tree_sha="$(git write-tree)"
          echo "materialized tree: ${tree_sha}"
          test "${tree_sha}" = '0ea96ee9a9b979d1d7cce506f597dc5c277e719e'

      - name: Commit exact migration tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: import certified standalone RLM tree'
          echo "migration commit: $(git rev-parse HEAD)"
          echo "migration tree: $(git rev-parse HEAD^{tree})"
          git push origin HEAD:main
