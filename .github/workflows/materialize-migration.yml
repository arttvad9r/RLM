name: Materialize certified RLM migration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download certified source tree
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/arttvad9r/Opencode-Autopilot/migration/rlm-export-f72/.migration/rlm-standalone-f72.tar.gz?token=CKKCPR5WNCN5TZO3KNUIA53KQVCYZAA' \
            -o /tmp/rlm-standalone-f72.tar.gz
      - name: Replace bootstrap tree and verify Git identity
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/rlm-standalone-f72.tar.gz -C .
          test ! -e .migration
          test ! -e .github/workflows/export-rlm-migration.yml
          git add -A
          tree_sha="$(git write-tree)"
          echo "materialized tree: ${tree_sha}"
          test "${tree_sha}" = '0ea96ee9a9b979d1d7cce506f597dc5c277e719e'
      - name: Commit exact migration tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: migrate certified standalone RLM tree' -m 'Source: arttvad9r/Opencode-Autopilot@f72b1fda78ef03d47a4278d2f16687550d5927fe' -m 'Source tree: 0ea96ee9a9b979d1d7cce506f597dc5c277e719e'
          git push origin HEAD:main
